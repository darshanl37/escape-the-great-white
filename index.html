<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#01101C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Escape the Great White - swim, collect pearls, dodge the shark.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%88%3C/text%3E%3C/svg%3E">
<title>Escape the Great White</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap">

<style>
  :root{
    --abyss:#01101C;
    --deep:#0A2E45;
    --water:#0E6A92;
    --shallow:#6FE3E0;
    --sun:#FFE9A8;
    --coral:#FF6B4A;
    --kelp:#1F7A55;
    --foam:#EAF7F7;
    --ink:#03202F;
    --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
    --body:"Nunito","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  /* no pull-to-refresh, no browser swipe-navigation: a stray drag must never leave the game */
  html,body{width:100%;max-width:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{
    margin:0;
    background:var(--abyss);
    color:var(--foam);
    font-family:var(--body);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  .stage{
    position:relative;
    width:min(100%, calc(100dvh * 450 / 800));
    aspect-ratio:450/800;
    overflow:hidden;
    background:var(--deep);
    box-shadow:0 0 80px rgba(0,0,0,.6);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- HUD ---------- */
  .hud[hidden]{display:none}
  .hud{
    position:absolute;inset:0 0 auto 0;
    display:flex;align-items:center;gap:clamp(8px,2.5vw,14px);
    padding:clamp(10px,3vw,16px);
    font-family:var(--display);
    pointer-events:none;
    text-shadow:0 2px 6px rgba(1,16,28,.65);
  }
  .hud__level{
    font-size:clamp(15px,4.4vw,22px);font-weight:600;letter-spacing:.06em;
    line-height:1;
  }
  .hud__lives{display:flex;gap:clamp(3px,1.2vw,6px);margin-left:auto}
  .heart{width:clamp(18px,5vw,26px);height:clamp(18px,5vw,26px);display:block}
  .heart path{fill:var(--coral);transition:fill .25s}
  .heart.spent path{fill:rgba(234,247,247,.16)}
  .hud__pearls{
    display:flex;align-items:center;gap:.4em;
    font-size:clamp(15px,4.4vw,22px);font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .hud__pearls .dot{
    width:clamp(11px,3vw,15px);height:clamp(11px,3vw,15px);border-radius:50%;
    background:var(--sun);box-shadow:0 0 10px rgba(255,233,168,.9);
  }

  .mute{
    pointer-events:auto;position:absolute;right:clamp(10px,3vw,16px);
    bottom:clamp(10px,3vw,16px);
    width:clamp(34px,9vw,42px);height:clamp(34px,9vw,42px);border-radius:50%;
    border:1.5px solid rgba(234,247,247,.28);
    background:rgba(1,16,28,.42);color:var(--foam);
    font-size:clamp(15px,4vw,19px);line-height:1;cursor:pointer;
    display:grid;place-items:center;backdrop-filter:blur(3px);
  }
  .mute:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  .pause{right:auto;left:clamp(10px,3vw,16px);font-size:clamp(12px,3.4vw,15px);letter-spacing:-.05em;font-weight:700}
  .pause[hidden]{display:none}

  /* ---------- Overlay cards ---------- */
  .overlay{
    position:absolute;inset:0;display:grid;place-items:center;
    pointer-events:none;                 /* the water stays touchable underneath */
    padding:clamp(20px,7vw,40px);text-align:center;
    background:radial-gradient(ellipse at 50% 42%, rgba(1,16,28,.34), rgba(1,16,28,.72));
    backdrop-filter:blur(2px);
    opacity:0;visibility:hidden;transition:opacity .35s ease;
  }
  .overlay.show{opacity:1;visibility:visible}
  .overlay.bare{background:none;backdrop-filter:none}
  /* the title water is playable, so keep it sharp — scrim only where the type sits */
  #ovTitle{
    backdrop-filter:none;
    background:linear-gradient(180deg,
      rgba(1,16,28,.62) 0%, rgba(1,16,28,.42) 34%,
      rgba(1,16,28,.12) 56%, rgba(1,16,28,0) 72%);
    align-content:start;padding-top:28dvh;
  }

  .card{max-width:34ch;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,3vw,16px)}

  h1{
    font-family:var(--display);font-weight:700;
    font-size:clamp(34px,10.5vw,54px);line-height:.92;letter-spacing:-.015em;
    margin:0;text-wrap:balance;
    text-shadow:0 4px 22px rgba(1,16,28,.7);
  }
  h1 .white{color:var(--foam)}
  h1 .great{
    display:block;color:var(--coral);
    text-shadow:0 0 28px rgba(255,107,74,.45);
  }
  h2{
    font-family:var(--display);font-weight:700;
    font-size:clamp(28px,8.5vw,42px);line-height:1;margin:0;text-wrap:balance;
  }
  .stat{
    font-family:var(--display);font-weight:700;margin:0;
    font-size:clamp(26px,8vw,38px);line-height:1;color:var(--sun);
  }

  .btn{
    pointer-events:auto;font-family:var(--display);font-weight:600;
    font-size:clamp(16px,4.6vw,20px);letter-spacing:.02em;
    padding:.7em 1.7em;border-radius:999px;border:none;cursor:pointer;
    background:var(--coral);color:#25060A;
    box-shadow:0 6px 0 #A83B26, 0 12px 30px rgba(255,107,74,.3);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #A83B26, 0 6px 18px rgba(255,107,74,.25)}
  .btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

  .zone{
    font-family:var(--display);font-weight:500;letter-spacing:.2em;
    text-transform:uppercase;font-size:clamp(11px,3.1vw,14px);
    color:var(--sun);opacity:.9;
  }
  .best{
    font-family:var(--display);font-size:clamp(12px,3.3vw,15px);
    letter-spacing:.1em;color:rgba(234,247,247,.55);text-transform:uppercase;
  }
  .depthbar{
    width:min(220px,60%);height:5px;border-radius:99px;
    background:rgba(234,247,247,.16);overflow:hidden;
  }
  .depthbar i{display:block;height:100%;background:linear-gradient(90deg,var(--shallow),var(--coral));border-radius:99px}

  .go{
    position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--display);font-weight:700;font-size:clamp(56px,17vw,90px);
    color:var(--sun);text-shadow:0 0 18px rgba(255,200,90,.9), 0 0 52px rgba(255,190,70,.6), 0 3px 0 rgba(120,60,10,.35);
    opacity:0;pointer-events:none;
  }
  .go.fire{animation:goflash .75s ease-out}
  .go.starburst{font-size:clamp(44px,13vw,66px);letter-spacing:.12em}
  .go.starburst.fire{animation-duration:1.2s}
  .go .off{color:rgba(234,247,247,.18);text-shadow:none}

  /* ---------- level select ---------- */
  .card.wide{max-width:none;width:100%}
  .grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,2.2vw,11px);
    width:100%;pointer-events:auto;
  }
  .lvl{
    cursor:pointer;border:none;border-radius:14px;padding:9px 2px 7px;
    background:rgba(234,247,247,.09);box-shadow:inset 0 0 0 1.5px rgba(234,247,247,.18);
    color:var(--foam);font-family:var(--display);
    display:flex;flex-direction:column;align-items:center;gap:2px;min-height:clamp(58px,15vw,72px);
    justify-content:center;
  }
  .lvl b{font-size:clamp(20px,6vw,27px);line-height:1;font-weight:600}
  .lvl i{font-style:normal;font-size:clamp(12px,3.4vw,15px);line-height:1}
  .lvl .st{font-size:clamp(10px,2.9vw,13px);letter-spacing:1px;color:rgba(234,247,247,.22);line-height:1}
  .lvl .st em{font-style:normal;color:var(--sun)}
  .lvl.deep{background:rgba(255,107,74,.10)}
  .lvl.next{box-shadow:inset 0 0 0 2px var(--coral),0 0 18px rgba(255,107,74,.4)}
  .lvl[disabled]{cursor:default;opacity:.32}
  .lvl:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn.ghost{
    background:rgba(234,247,247,.12);color:var(--foam);
    box-shadow:0 0 0 1.5px rgba(234,247,247,.32);
  }
  .btn.ghost:active{box-shadow:0 0 0 1.5px rgba(234,247,247,.32)}
  .bigstars{font-family:var(--display);font-size:clamp(30px,9vw,44px);letter-spacing:.14em;color:var(--sun);margin:0;line-height:1}
  @keyframes goflash{
    0%{opacity:0;transform:scale(.6)}
    25%{opacity:1;transform:scale(1.04)}
    70%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.25)}
  }

  @media (prefers-reduced-motion: reduce){
    .overlay{transition:none}
    .go.fire{animation-duration:.01s}
    .btn{transition:none}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" aria-label="Escape the Great White — swim away from the shark and collect the pearls"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud__level"><span id="hudLevel">Level 1</span></div>
    <div class="hud__pearls"><span class="dot"></span><span id="hudPearls">0/3</span></div>
    <div class="hud__lives" id="hudLives"></div>
  </div>

  <div class="go" id="goFlash">Go!</div>
  <div class="go starburst" id="starFlash"></div>

  <div class="overlay show" id="ovTitle">
    <div class="card">
      <h1><span class="white">Escape the</span><span class="great">Great White</span></h1>
      <button class="btn" id="btnStart">Play</button>
      <p class="best" id="bestLine"></p>
    </div>
  </div>

  <div class="overlay" id="ovSelect">
    <div class="card wide">
      <h2>Levels</h2>
      <div class="grid" id="grid"></div>
      <button class="btn ghost" id="btnSelBack">Back</button>
    </div>
  </div>

  <div class="overlay bare" id="ovLevel">
    <div class="card">
      <h2 id="lvTitle">Level 1</h2>
      <p class="zone" id="lvZone">Sunlit Shallows</p>
      <div class="depthbar"><i id="lvDepth" style="width:4%"></i></div>
    </div>
  </div>

  <div class="overlay" id="ovCaught">
    <div class="card">
      <h2>Chomp!</h2>
      <button class="btn" id="btnRetry">Again</button>
    </div>
  </div>

  <div class="overlay" id="ovPause">
    <div class="card">
      <h2>Paused</h2>
      <div class="row"><button class="btn" id="btnResume">Swim on</button><button class="btn ghost" id="btnPauseLevels">Levels</button></div>
    </div>
  </div>

  <div class="overlay" id="ovOver">
    <div class="card">
      <h2>The Great White wins</h2>
      <p class="stat" id="overLine">Level 1</p>
      <div class="row"><button class="btn" id="btnRestart">Try again</button><button class="btn ghost" id="btnOverLevels">Levels</button></div>
    </div>
  </div>

  <div class="overlay" id="ovWin">
    <div class="card">
      <h2>You escaped!</h2>
      <p class="bigstars" id="winStars"></p>
      <button class="btn" id="btnPlayAgain">Levels</button>
    </div>
  </div>

  <button class="mute pause" id="btnPause" aria-label="Pause" hidden>&#10074;&#10074;</button>
  <button class="mute" id="btnMute" aria-label="Mute sound">&#9835;</button>
</div>

<script>
(function(){
"use strict";

/* =========================================================================
   THE DIFFICULTY CURVE.
   Every level is one row of numbers. Tune here, nowhere else.
   speed  : shark forward speed (player tops out at 4.15)
   turn   : how fast a shark can rotate — low turn = it overshoots and you juke it
   sharks : how many
   pearls : how many to collect
   rocks  : obstacles the shark bonks into
   kelp   : slow-zones for sharks, free passage for you
   lunge  : shark winds up and bursts
   lead   : frames of aim-ahead. 0 = chases where you ARE; >0 = where you're GOING

   Levels 13-20 each add one twist (shark numbers stay near level 10-12,
   the twist is the new difficulty):
   jelly  : drifting jellyfish — a sting slows you down for a moment
   current: sideways ocean streams that push you AND the sharks
   hammer : a hammerhead that dashes straight across a row, after a warning
   clams  : pearls sit in clams that open and shut — wait for them
   dark   : lights out; you only see as far as this radius around you
   whirl  : a whirlpool that drags everything round its middle
   mega   : the first shark is a Megalodon
   shield : bubble pickups — each one blocks one bite
   ========================================================================= */
const LEVELS = [
  { speed:1.70, turn:0.026, sharks:1, pearls:3, rocks:0, kelp:1, lunge:false, lead:0,  pup:1    },
  { speed:1.90, turn:0.030, sharks:1, pearls:4, rocks:1, kelp:1, lunge:false, lead:0,  pup:1    },
  { speed:2.10, turn:0.034, sharks:1, pearls:4, rocks:2, kelp:2, lunge:false, lead:0,  pup:1    },
  { speed:2.30, turn:0.039, sharks:1, pearls:5, rocks:2, kelp:2, lunge:false, lead:0,  pup:1    },
  { speed:2.50, turn:0.044, sharks:1, pearls:5, rocks:3, kelp:2, lunge:false, lead:0,  pup:1    },
  { speed:2.65, turn:0.049, sharks:1, pearls:6, rocks:3, kelp:2, lunge:true,  lead:0,  pup:1    },
  { speed:2.80, turn:0.055, sharks:1, pearls:6, rocks:4, kelp:3, lunge:true,  lead:7,  pup:1    },
  { speed:2.95, turn:0.060, sharks:1, pearls:7, rocks:4, kelp:3, lunge:true,  lead:9,  pup:1    },
  { speed:3.10, turn:0.066, sharks:1, pearls:7, rocks:5, kelp:3, lunge:true,  lead:11, pup:1    },
  { speed:2.85, turn:0.058, sharks:2, pearls:8, rocks:5, kelp:4, lunge:true,  lead:8,  pup:0.72 },
  { speed:3.05, turn:0.066, sharks:2, pearls:8, rocks:5, kelp:4, lunge:true,  lead:10, pup:0.85 },
  { speed:3.25, turn:0.073, sharks:2, pearls:9, rocks:6, kelp:4, lunge:true,  lead:13, pup:0.95 },
  // ---- beyond the abyss: one new twist per level ----
  { name:"Jellyfish Bloom",  icon:"\u{1FABC}", speed:3.00, turn:0.064, sharks:1, pearls:7, rocks:3, kelp:3, lunge:true, lead:10, pup:1,   jelly:5 },
  { name:"Riptide",          icon:"\u{1F30A}", speed:3.05, turn:0.066, sharks:1, pearls:8, rocks:3, kelp:3, lunge:true, lead:10, pup:1,   current:1.15 },
  { name:"Hammerhead Alley", icon:"\u{1F528}", speed:3.00, turn:0.064, sharks:1, pearls:8, rocks:4, kelp:3, lunge:true, lead:10, pup:1,   hammer:1, shield:1 },
  { name:"Clam Beds",        icon:"\u{1F41A}", speed:3.10, turn:0.068, sharks:1, pearls:8, rocks:4, kelp:3, lunge:true, lead:11, pup:1,   clams:true, jelly:2 },
  { name:"Lights Out",       icon:"\u{1F526}", speed:3.00, turn:0.064, sharks:1, pearls:8, rocks:4, kelp:3, lunge:true, lead:10, pup:1,   dark:155 },
  { name:"The Whirlpool",    icon:"\u{1F300}", speed:2.90, turn:0.062, sharks:2, pearls:9, rocks:3, kelp:3, lunge:true, lead:9,  pup:0.8, whirl:1, shield:1 },
  { name:"Shark Pack",       icon:"\u{1F988}", speed:2.90, turn:0.062, sharks:3, pearls:9, rocks:4, kelp:4, lunge:true, lead:9,  pup:0.75, shield:1 },
  { name:"Megalodon",        icon:"\u{1F451}", speed:2.80, turn:0.058, sharks:2, pearls:10, rocks:5, kelp:4, lunge:true, lead:11, pup:0.8, mega:true, jelly:3, shield:1 }
];
const ZONES = ["Sunlit Shallows","The Kelp Forest","Twilight Zone","The Abyss"];
const zoneFor = i => LEVELS[i].name || ZONES[Math.min(3, Math.floor(i/3))];
const NL = LEVELS.length;

const PACE = 0.9;            // global slow-motion. Same geometry, more thinking time.
const START_LIVES = 3;       // hearts per level; the hearts left when you clear it = your stars
const MEGA = 1.8;            // Megalodon size
// Touch reach: the swimmer reaches the arena wall while your finger is still this
// far in from the screen edge. Edge swipes are the phone's "back" gesture.
const EDGE = 50;
const VW = 450, VH = 800;
const PLAYER_SPEED = 4.15 * PACE;

/* ---------- palette ---------- */
const SHALLOW_TOP=[0x6F,0xE3,0xE0], SHALLOW_BOT=[0x0E,0x6A,0x92];
const ABYSS_TOP  =[0x0A,0x2E,0x45], ABYSS_BOT  =[0x01,0x10,0x1C];
const SUN='#FFE9A8', CORAL='#FF6B4A', KELP='#1F7A55', ROCK='#08222F';

const lerp=(a,b,t)=>a+(b-a)*t;
const mix=(c1,c2,t)=>'rgb('+Math.round(lerp(c1[0],c2[0],t))+','+Math.round(lerp(c1[1],c2[1],t))+','+Math.round(lerp(c1[2],c2[2],t))+')';
const clamp=(v,lo,hi)=>v<lo?lo:v>hi?hi:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function normAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}

/* ---------- canvas ---------- */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let scale=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  scale=cv.width/VW;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage);

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tiny sound (no assets — pure WebAudio) ---------- */
let actx=null, muted=false;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=false; } } return actx; }
function tone(freq,dur,type,vol,slideTo){
  if(muted) return; const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,a.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur);
  g.gain.setValueAtTime(0.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.14,a.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
const sfx={
  pearl:n=>tone(660+n*70,0.16,'sine',0.12,980+n*70),
  chomp:()=>{tone(150,0.32,'sawtooth',0.16,52);tone(78,0.42,'sine',0.12,40);},
  clear:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.12),i*95));},
  over :()=>{[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.34,'sine',0.14),i*170));},
  win  :()=>{[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.13),i*130));},
  bonk :()=>tone(110,0.1,'square',0.07,70),
  sting:()=>{tone(1250,0.09,'square',0.05,420);setTimeout(()=>tone(900,0.08,'square',0.04,300),70);},
  warn :()=>tone(196,0.22,'sawtooth',0.05,262),
  whoosh:()=>tone(520,0.35,'sawtooth',0.05,90),
  shield:()=>{tone(520,0.12,'triangle',0.1,880);setTimeout(()=>tone(880,0.16,'triangle',0.1,1320),90);},
  pop  :()=>tone(700,0.18,'sine',0.14,140),
  star :n=>tone(784+n*130,0.18,'triangle',0.11)
};

/* ---------- game state ---------- */
const S={TITLE:0,INTRO:1,PLAY:2,CAUGHT:3,OVER:4,WIN:5,SELECT:6,PAUSE:7};
let state=S.TITLE;
let levelIdx=0, lives=START_LIVES, flowT=0;

// progress: which levels are open + best stars per level. Survives closing the tab.
let save={unlocked:1, stars:Array(NL).fill(0)};
try{
  const s=JSON.parse(localStorage.getItem('egw.save')||'null');
  if(s && Array.isArray(s.stars)){ save.unlocked=s.unlocked|0||1; s.stars.forEach((v,i)=>{ if(i<NL) save.stars[i]=v|0; }); }
  // carry over the old single "best level" score
  const old=parseInt(localStorage.getItem('egw.best')||'1',10)||1;
  save.unlocked=clamp(Math.max(save.unlocked,old),1,NL);
}catch(e){}
function persist(){ try{ localStorage.setItem('egw.save',JSON.stringify(save)); }catch(e){} }
// ?all opens every level for this visit only (handy for trying the new ones)
let openAll=false;
try{ openAll=/[?&]all\b/.test(location.search); }catch(e){}
const isOpen=i=>openAll || i<save.unlocked;
const totalStars=()=>save.stars.reduce((a,b)=>a+b,0);

let player={x:VW/2,y:VH-110,vx:0,vy:0,r:11,tail:0,invuln:0,alive:true,facing:-Math.PI/2,sting:0,shield:false};
let sharks=[], pearls=[], rocks=[], kelps=[], bubbles=[], bits=[];
let jellies=[], bands=[], whirl=null, hammer=null, shields=[], cur={};
let target=null, ptr=null, freeze=0, shakeT=0, flashT=0, depth=0, tAmb=0;
const keys=Object.create(null);

/* ---------- spawning ---------- */
function farEnough(x,y,list,min){ for(const o of list){ if(dist2(x,y,o.x,o.y)<min*min) return false; } return true; }
function place(list,min,margin,avoid,opt){
  const bot=(opt&&opt.bot)||margin, keep=opt&&opt.keepOut;
  for(let i=0;i<300;i++){
    const x=rand(margin,VW-margin), y=rand(margin+70,VH-bot);
    if(!farEnough(x,y,list,min)) continue;
    if(avoid && !farEnough(x,y,avoid.list,avoid.min)) continue;
    if(keep && dist2(x,y,keep.x,keep.y)<keep.r*keep.r) continue;   // mute button sits here
    return {x,y};
  }
  return {x:rand(margin,VW-margin), y:rand(margin+70,VH-bot)};
}

function buildLevel(i){
  const L=LEVELS[i];
  cur=L;
  depth=Math.min(1, i/11);

  player.x=VW/2; player.y=VH-110; player.vx=player.vy=0;
  player.invuln=90; player.alive=true; player.facing=-Math.PI/2;
  player.sting=0; player.shield=false;
  target=null;

  rocks=[]; kelps=[]; pearls=[]; bits=[];
  jellies=[]; bands=[]; whirl=null; hammer=null; shields=[];

  const spawnGuard={list:[{x:player.x,y:player.y}],min:120};

  if(L.whirl){
    whirl={x:rand(150,VW-150), y:rand(270,450), R:165, rot:0};
    spawnGuard.list.push(whirl);   // nothing solid sits in the middle of it
  }
  if(L.current){
    // three streams, alternating direction, kept off the spawn row
    const ys=[190,370,545];
    ys.forEach((y,n)=>bands.push({y:y+rand(-25,25), h:92, dir:(n%2?-1:1)*(Math.random()<0.5?1:-1)}));
    if(bands[0].dir===bands[1].dir) bands[1].dir*=-1;
    if(bands[1].dir===bands[2].dir) bands[2].dir*=-1;
  }

  for(let n=0;n<L.rocks;n++){
    const p=place(rocks.concat(kelps),96,54,spawnGuard);
    const r=rand(26,40), pts=[];
    const sides=Math.floor(rand(7,11));
    for(let s=0;s<sides;s++){
      const a=s/sides*Math.PI*2 + rand(-0.18,0.18);
      const rr=r*rand(0.60,1.26);
      pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);
    }
    rocks.push({x:p.x,y:p.y,r:r,pts:pts});
  }
  for(let n=0;n<L.kelp;n++){
    const p=place(rocks.concat(kelps),100,56,spawnGuard);
    const r=rand(46,62), strands=[];
    for(let s=0;s<9;s++) strands.push({ox:rand(-r*0.8,r*0.8),h:rand(r*1.2,r*2.0),ph:rand(0,6.283),w:rand(3.5,6.5)});
    kelps.push({x:p.x,y:p.y,r:r,strands:strands});
  }
  // the pause button (bottom-left) and mute button (bottom-right) are never covered
  const corners=[{x:VW-30,y:VH-30},{x:30,y:VH-30}];
  const pearlAvoid={list:rocks.concat(whirl?[{x:whirl.x,y:whirl.y,eye:1}]:[]),min:56};
  for(let n=0;n<L.pearls;n++){
    let p;
    for(let k=0;k<40;k++){
      p=place(pearls,74,42,pearlAvoid,{bot:86,keepOut:{x:corners[0].x,y:corners[0].y,r:78}});
      if(dist2(p.x,p.y,corners[1].x,corners[1].y)>=78*78) break;
    }
    pearls.push({x:p.x,y:p.y,ph:rand(0,6.283),got:false,
                 clam:!!L.clams, ct:Math.floor(rand(0,CLAM_CYCLE))});
  }
  for(let n=0;n<(L.shield||0);n++){
    const p=place(pearls.concat(shields),90,50,{list:rocks,min:60},{bot:120});
    shields.push({x:p.x,y:p.y,ph:rand(0,6.283)});
  }
  for(let n=0;n<(L.jelly||0);n++){
    const p=place(jellies,110,40,{list:[{x:player.x,y:player.y}],min:170},{bot:140});
    const a=rand(0,6.283), v=rand(0.35,0.7)*PACE;
    jellies.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,ph:rand(0,6.283),r:15});
  }
  if(L.hammer) hammer={st:0, cd:200, t:0, x:-100, y:0, dir:1};

  sharks=[];
  for(let n=0;n<L.sharks;n++){
    // shark one is the big one (a Megalodon on the last level); the rest are smaller pups
    const mega = n===0 && L.mega;
    const sc = mega ? MEGA : n===0 ? 1 : (L.pup||1);
    const spd = mega ? L.speed*0.92 : L.speed*(n===0?1:(L.pup||1));
    sharks.push({
      x: [70, VW-70, VW/2][n%3], y: 120 + n*40,
      a: Math.PI/2, spd:spd*PACE, sc:sc, mega:mega, stun:0,
      lungeCd: rand(120,220), lungeState:0, lungeT:0, mouth:0, wob:rand(0,6.283)
    });
  }
  bubbles=[];
  for(let n=0;n<26;n++) bubbles.push({x:rand(0,VW),y:rand(0,VH),r:rand(1.4,4.2),sp:rand(0.25,0.9),ph:rand(0,6.283)});
}

/* ---------- twists ---------- */
const CLAM_CYCLE=210;              // frames: ~2s open, ~1.3s shut
function clamOpen(p){
  const c=p.ct%CLAM_CYCLE;
  if(c<14) return c/14;
  if(c<130) return 1;
  if(c<144) return 1-(c-130)/14;
  return 0;
}
// how much the water itself pushes anything at (x,y): streams + whirlpool
function flowAt(x,y){
  let fx=0, fy=0;
  for(const b of bands){
    const dy=Math.abs(y-b.y);
    if(dy<b.h/2) fx+=b.dir*cur.current*PACE*Math.min(1,(b.h/2-dy)/18);
  }
  if(whirl){
    const dx=whirl.x-x, dy=whirl.y-y, d=Math.hypot(dx,dy);
    if(d<whirl.R && d>2){
      const k=1-d/whirl.R, pull=cur.whirl*1.55*k*PACE;
      fx+=dx/d*pull*0.55 - dy/d*pull;      // inward + round and round
      fy+=dy/d*pull*0.55 + dx/d*pull;
    }
  }
  return {x:fx,y:fy};
}
// a bite (or a hammerhead) reached the swimmer. A bubble shield eats it instead.
function bitten(by){
  if(player.shield){
    player.shield=false; player.invuln=80;
    sfx.pop(); burst(player.x,player.y,'#BFF4FF',22,4);
    if(by){ by.stun=70; by.a=normAngle(by.a+Math.PI); by.lungeState=0; by.lungeCd=rand(160,240); }
    return false;
  }
  caught();
  return true;
}

/* ---------- particles ---------- */
function burst(x,y,color,count,spread){
  for(let i=0;i<count;i++){
    const a=rand(0,6.283), s=rand(0.6,spread||3.6);
    bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rand(1.6,4.4),c:color});
  }
}

/* =========================================================================
   UPDATE
   ========================================================================= */
function update(){
  tAmb+=0.016;

  for(const b of bubbles){
    b.y-=b.sp*(reduced?0.3:1);
    b.x+=Math.sin(tAmb*1.4+b.ph)*0.22;
    if(b.y<-8){ b.y=VH+8; b.x=rand(0,VW); }
  }
  for(let i=bits.length-1;i>=0;i--){
    const p=bits[i];
    p.x+=p.vx; p.y+=p.vy; p.vy-=0.035; p.vx*=0.96; p.vy*=0.96;
    p.life-=0.024;
    if(p.life<=0) bits.splice(i,1);
  }
  if(shakeT>0) shakeT--;
  if(flashT>0) flashT--;

  if(state!==S.PLAY && state!==S.TITLE) return;
  if(freeze>0){ freeze--; }

  /* ---- player ---- */
  if(ptr) target=aimAt(ptr);        // a finger still pressed keeps steering
  let tx=null,ty=null;
  if(target){ tx=target.x; ty=target.y; }
  let ax=0, ay=0;
  if(keys.left) ax-=1; if(keys.right) ax+=1;
  if(keys.up) ay-=1; if(keys.down) ay+=1;
  if(ax||ay){ const m=Math.hypot(ax,ay); tx=player.x+ax/m*200; ty=player.y+ay/m*200; }

  const topSpeed=PLAYER_SPEED*(player.sting>0?0.5:1);   // a jellyfish sting slows you
  if(tx!==null){
    const dx=tx-player.x, dy=ty-player.y, d=Math.hypot(dx,dy);
    if(d>3){
      const ease=clamp(d/60,0.25,1);
      player.vx+=(dx/d*topSpeed*ease-player.vx)*0.24;
      player.vy+=(dy/d*topSpeed*ease-player.vy)*0.24;
    } else { player.vx*=0.8; player.vy*=0.8; }
  } else { player.vx*=0.9; player.vy*=0.9; }

  player.x+=player.vx; player.y+=player.vy;
  if(state===S.PLAY && freeze<=0){ const f=flowAt(player.x,player.y); player.x+=f.x; player.y+=f.y; }
  if(player.sting>0) player.sting--;
  player.x=clamp(player.x,player.r,VW-player.r);
  player.y=clamp(player.y,player.r+8,VH-player.r);

  const sp=Math.hypot(player.vx,player.vy);
  if(sp>0.35) player.facing=Math.atan2(player.vy,player.vx);
  player.tail+=0.18+sp*0.10;
  if(player.invuln>0) player.invuln--;

  for(const r of rocks){
    const dx=player.x-r.x, dy=player.y-r.y, d=Math.hypot(dx,dy), min=r.r+player.r;
    if(d<min && d>0.01){ player.x=r.x+dx/d*min; player.y=r.y+dy/d*min; player.vx*=0.5; player.vy*=0.5; }
  }

  if(state!==S.PLAY) return;   // title screen: swim around, nothing can hurt you

  flowT+=0.016;
  if(whirl) whirl.rot+=0.035*PACE;

  /* ---- bubble shields ---- */
  for(let i=shields.length-1;i>=0;i--){
    const b=shields[i]; b.ph+=0.05;
    if(dist2(player.x,player.y,b.x,b.y)<32*32){
      shields.splice(i,1); player.shield=true;
      sfx.shield(); burst(b.x,b.y,'#BFF4FF',18,3.2);
    }
  }

  /* ---- jellyfish: drift, bounce, sting ---- */
  for(const j of jellies){
    j.ph+=0.06;
    if(freeze<=0){
      const f=flowAt(j.x,j.y);
      j.x+=j.vx+f.x*0.6; j.y+=j.vy+Math.sin(j.ph)*0.35+f.y*0.6;
      if(j.x<24){j.x=24;j.vx=Math.abs(j.vx);} if(j.x>VW-24){j.x=VW-24;j.vx=-Math.abs(j.vx);}
      if(j.y<80){j.y=80;j.vy=Math.abs(j.vy);} if(j.y>VH-40){j.y=VH-40;j.vy=-Math.abs(j.vy);}
    }
    if(player.sting<=0 && player.invuln<=0 && dist2(player.x,player.y,j.x,j.y)<(j.r+player.r-3)*(j.r+player.r-3)){
      player.sting=80; sfx.sting(); burst(player.x,player.y,'#E59BFF',14,3);
    }
  }

  /* ---- hammerhead: warn the row, then dash straight across it ---- */
  if(hammer && freeze<=0){
    const h=hammer;
    if(h.st===0){
      if(--h.cd<=0){
        h.st=1; h.t=72; h.dir=Math.random()<0.5?1:-1;
        h.y=clamp(player.y,100,VH-70); sfx.warn();
      }
    } else if(h.st===1){
      if(--h.t<=0){ h.st=2; h.x=h.dir>0?-90:VW+90; sfx.whoosh(); }
    } else {
      h.x+=h.dir*8.6*PACE;
      if((h.dir>0 && h.x>VW+110) || (h.dir<0 && h.x<-110)){ h.st=0; h.cd=rand(150,230); }
      else if(player.invuln<=0 && player.alive){
        const hx=h.x+h.dir*34;
        if(dist2(player.x,player.y,hx,h.y)<26*26 || dist2(player.x,player.y,h.x,h.y)<21*21){
          if(bitten(null)) return;
        }
      }
    }
  }

  /* ---- pearls ---- */
  for(const p of pearls){
    if(p.got) continue;
    p.ph+=0.045;
    if(p.clam){ p.ct++; if(clamOpen(p)<0.5) continue; }   // shut clam: wait for it
    if(dist2(player.x,player.y,p.x,p.y) < 26*26){
      p.got=true;
      const n=pearls.filter(q=>q.got).length;
      sfx.pearl(n);
      burst(p.x,p.y,SUN,16,3.2);
      updateHUD();
      if(pearls.every(q=>q.got)) return levelClear();
    }
  }

  /* ---- sharks ---- */
  const L=LEVELS[levelIdx];
  for(const s of sharks){
    s.wob+=0.09;
    if(freeze>0) continue;
    if(s.stun>0){ s.stun--; }

    // lunge state machine: 0 idle, 1 wind-up (telegraph), 2 burst
    let spd=s.spd;
    if(L.lunge && s.stun<=0){
      if(s.lungeState===0){
        s.lungeCd--;
        const reach=190*(s.mega?1.3:1);
        if(s.lungeCd<=0 && dist2(s.x,s.y,player.x,player.y)<reach*reach){ s.lungeState=1; s.lungeT=28; }
      } else if(s.lungeState===1){
        s.lungeT--; spd*=0.18; s.mouth=lerp(s.mouth,1,0.18);
        if(s.lungeT<=0){ s.lungeState=2; s.lungeT=30; }
      } else {
        s.lungeT--; spd*=2.15; s.mouth=lerp(s.mouth,0.6,0.12);
        if(s.lungeT<=0){ s.lungeState=0; s.lungeCd=rand(150,260); }
      }
    }
    if(s.lungeState===0) s.mouth=lerp(s.mouth,0,0.1);
    if(s.stun>0) spd*=0.35;

    // seaweed slows sharks — the player's safe haven
    for(const k of kelps){ if(dist2(s.x,s.y,k.x,k.y)<k.r*k.r){ spd*=0.5; break; } }

    // steering: aim where you ARE, or (level 7+) where you're GOING
    let tX=player.x + player.vx*(L.lead/PACE);
    let tY=player.y + player.vy*(L.lead/PACE);
    tX=clamp(tX,0,VW); tY=clamp(tY,0,VH);
    const want=Math.atan2(tY-s.y, tX-s.x);
    const near=Math.hypot(player.x-s.x, player.y-s.y);
    // Once it's this close the shark has committed: it can barely steer, so a
    // last-moment dodge always beats it. Every death is "too slow", never "unfair".
    const sc0=s.sc||1;
    const turn = (near<58*sc0 ? L.turn*0.10
               : s.lungeState===1 ? L.turn*0.35
               : L.turn) * PACE * (s.mega?0.8:1);
    s.a += clamp(normAngle(want-s.a), -turn, turn);

    s.x+=Math.cos(s.a)*spd;
    s.y+=Math.sin(s.a)*spd;
    if(bands.length || whirl){ const f=flowAt(s.x,s.y); s.x+=f.x; s.y+=f.y; }

    // walls
    if(s.x<24){ s.x=24; s.a=normAngle(Math.PI-s.a); }
    if(s.x>VW-24){ s.x=VW-24; s.a=normAngle(Math.PI-s.a); }
    if(s.y<24){ s.y=24; s.a=normAngle(-s.a); }
    if(s.y>VH-24){ s.y=VH-24; s.a=normAngle(-s.a); }

    // rocks bonk the shark — lead it in and buy yourself time
    for(const r of rocks){
      const dx=s.x-r.x, dy=s.y-r.y, d=Math.hypot(dx,dy), min=r.r+22*(s.sc||1);
      if(d<min && d>0.01){
        s.x=r.x+dx/d*min; s.y=r.y+dy/d*min;
        s.a=Math.atan2(dy,dx)+rand(-0.5,0.5);
        if(s.stun<=0){ sfx.bonk(); burst(s.x,s.y,'#9FD3E0',8,2.2); }
        s.stun=42; s.lungeState=0; s.lungeCd=rand(140,240);
      }
    }

    // BITE: only the front of the shark hurts. Brushing the tail is free.
    if(player.invuln<=0 && player.alive){
      const sc=s.sc||1;
      const noseX=s.x+Math.cos(s.a)*34*sc, noseY=s.y+Math.sin(s.a)*34*sc;
      const jawX =s.x+Math.cos(s.a)*16*sc, jawY =s.y+Math.sin(s.a)*16*sc;
      if(dist2(player.x,player.y,noseX,noseY) < (24*sc)*(24*sc) ||
         dist2(player.x,player.y,jawX,jawY)  < (25*sc)*(25*sc)){
        if(bitten(s)) return;
      }
    }
  }
}

/* =========================================================================
   RENDER
   ========================================================================= */
function bg(){
  const top=mix(SHALLOW_TOP,ABYSS_TOP,depth), bot=mix(SHALLOW_BOT,ABYSS_BOT,depth);
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  // god-rays: strong in the shallows, gone in the abyss
  const rayA=(1-depth)*0.5;
  if(rayA>0.01){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<5;i++){
      const base=(i*103)%VW, sway=Math.sin(tAmb*0.35+i)*26;
      const rg=ctx.createLinearGradient(0,0,0,VH*0.85);
      rg.addColorStop(0,'rgba(255,245,205,'+(rayA*0.4)+')');
      rg.addColorStop(1,'rgba(255,245,205,0)');
      ctx.fillStyle=rg;
      ctx.beginPath();
      ctx.moveTo(base-16+sway,-10); ctx.lineTo(base+26+sway,-10);
      ctx.lineTo(base+104+sway*2.2,VH*0.85); ctx.lineTo(base-58+sway*2.2,VH*0.85);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // marine snow drifts in as it gets deep
  if(depth>0.12){
    ctx.fillStyle='rgba(220,240,245,'+(depth*0.30)+')';
    for(let i=0;i<46;i++){
      const x=(i*97.3)%VW, y=((i*53.7)+tAmb*11*(0.4+(i%5)*0.16))%VH;
      ctx.fillRect(x,y,1.5,1.5);
    }
  }
}

function drawBubbles(){
  ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=1;
  for(const b of bubbles){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.stroke(); }
}

function drawRock(rock){
  const R=rock.r;
  ctx.save(); ctx.translate(rock.x,rock.y);
  ctx.beginPath(); ctx.moveTo(rock.pts[0][0],rock.pts[0][1]);
  for(let i=1;i<rock.pts.length;i++) ctx.lineTo(rock.pts[i][0],rock.pts[i][1]);
  ctx.closePath();
  // rock catches the light in the shallows and turns to silhouette in the abyss
  const rg=ctx.createLinearGradient(0,-R,0,R);
  rg.addColorStop(0,   mix([0x73,0x94,0xA4],[0x1B,0x3D,0x52],depth));
  rg.addColorStop(0.55,mix([0x3E,0x62,0x78],[0x08,0x22,0x2F],depth));
  rg.addColorStop(1,   mix([0x22,0x45,0x59],[0x04,0x14,0x1E],depth));
  ctx.fillStyle=rg; ctx.fill();
  ctx.strokeStyle='rgba(160,215,230,'+(0.20+depth*0.26)+')'; ctx.lineWidth=1.6; ctx.stroke();
  ctx.save(); ctx.clip();                      // a rim of light along the top edge
  ctx.strokeStyle='rgba(190,235,245,'+(0.22+depth*0.20)+')'; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.ellipse(0,R*0.30,R*1.06,R*0.96,0,Math.PI*1.08,Math.PI*1.92); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawKelp(k){
  ctx.save(); ctx.translate(k.x,k.y);
  ctx.strokeStyle='rgba(31,122,85,'+(0.30+depth*0.12)+')';
  ctx.fillStyle='rgba(31,122,85,.13)';
  ctx.beginPath(); ctx.arc(0,0,k.r,0,6.283); ctx.fill();
  ctx.lineCap='round';
  for(const st of k.strands){
    const sway=Math.sin(tAmb*(reduced?0.2:1.1)+st.ph)*9;
    ctx.lineWidth=st.w;
    ctx.strokeStyle='rgba(31,122,85,'+(0.55+depth*0.2)+')';
    ctx.beginPath();
    ctx.moveTo(st.ox,k.r*0.7);
    ctx.quadraticCurveTo(st.ox+sway, k.r*0.7-st.h*0.55, st.ox+sway*1.7, k.r*0.7-st.h);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBands(){
  for(const b of bands){
    ctx.fillStyle='rgba(190,240,255,.06)';
    ctx.fillRect(0,b.y-b.h/2,VW,b.h);
    ctx.strokeStyle='rgba(215,248,255,.30)'; ctx.lineWidth=2; ctx.lineCap='round';
    const sp=flowT*95*cur.current*b.dir;
    for(let k=0;k<9;k++){
      const x=(((k*67+sp)%(VW+60))+VW+60)%(VW+60)-30;
      const y=b.y-b.h/2+12+((k*29)%(b.h-24));
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-b.dir*26,y); ctx.stroke();
      // a chevron on every third streak shows which way it flows
      if(k%3===0){ ctx.beginPath(); ctx.moveTo(x-b.dir*6,y-5); ctx.lineTo(x,y); ctx.lineTo(x-b.dir*6,y+5); ctx.stroke(); }
    }
  }
}

function drawWhirl(){
  const w=whirl;
  ctx.save(); ctx.translate(w.x,w.y);
  const g=ctx.createRadialGradient(0,0,4,0,0,w.R);
  g.addColorStop(0,'rgba(0,8,16,.55)'); g.addColorStop(0.35,'rgba(0,20,34,.22)'); g.addColorStop(1,'rgba(0,20,34,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,w.R,0,6.283); ctx.fill();
  ctx.lineCap='round';
  for(let arm=0;arm<4;arm++){
    ctx.beginPath();
    for(let t=0;t<=1.0001;t+=0.05){
      const a=arm*Math.PI/2 - w.rot - t*4.2, r=8+t*(w.R-12);
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      if(t===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(205,245,255,.26)'; ctx.lineWidth=3; ctx.stroke();
  }
  ctx.restore();
}

function drawClam(p){
  const o=clamOpen(p);
  ctx.save(); ctx.translate(p.x,p.y+9);
  ctx.fillStyle='#C98FA6'; ctx.strokeStyle='rgba(60,20,40,.5)'; ctx.lineWidth=1.4;
  // bottom shell
  ctx.beginPath(); ctx.ellipse(0,0,17,8,0,0,Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
  // top shell lifts up behind the pearl when open, covers it when shut
  ctx.save(); ctx.translate(0,-o*14); ctx.scale(1,1+o*0.25);
  ctx.fillStyle='#E7B3C6';
  ctx.beginPath(); ctx.ellipse(0,0,17,11,0,Math.PI,Math.PI*2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='rgba(120,50,80,.45)'; ctx.lineWidth=1;
  for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(k*6,-10); ctx.stroke(); }
  ctx.restore();
  ctx.restore();
}

function drawShieldItem(b){
  const r=16+Math.sin(b.ph*1.4)*2, y=b.y+Math.sin(b.ph)*3;
  ctx.save(); ctx.translate(b.x,y);
  const g=ctx.createRadialGradient(0,0,2,0,0,r+12);
  g.addColorStop(0,'rgba(190,245,255,.0)'); g.addColorStop(0.6,'rgba(190,245,255,.25)'); g.addColorStop(1,'rgba(190,245,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r+12,0,6.283); ctx.fill();
  ctx.strokeStyle='rgba(225,252,255,.95)'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(-r*0.4,-r*0.4,2.6,0,6.283); ctx.fill();
  ctx.restore();
}

function drawJelly(j){
  ctx.save(); ctx.translate(j.x,j.y);
  const pulse=1+Math.sin(j.ph*2)*0.08;
  const g=ctx.createRadialGradient(0,-2,2,0,-2,j.r*2.2);
  g.addColorStop(0,'rgba(229,155,255,.45)'); g.addColorStop(1,'rgba(229,155,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-2,j.r*2.2,0,6.283); ctx.fill();
  // tentacles
  ctx.strokeStyle='rgba(240,190,255,.75)'; ctx.lineWidth=1.8; ctx.lineCap='round';
  for(let k=0;k<5;k++){
    const x0=(k-2)*5;
    ctx.beginPath(); ctx.moveTo(x0,2);
    ctx.quadraticCurveTo(x0+Math.sin(j.ph*1.5+k)*6, 14, x0+Math.sin(j.ph+k)*4, 24+(k%2)*5);
    ctx.stroke();
  }
  // bell
  ctx.fillStyle='rgba(236,170,255,.85)';
  ctx.beginPath(); ctx.ellipse(0,0,j.r*pulse,j.r*0.85/pulse,0,Math.PI,Math.PI*2);
  ctx.quadraticCurveTo(0,6,-j.r*pulse,0); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-4,-6,3.5,2.2,-0.4,0,6.283); ctx.fill();
  ctx.restore();
}

function drawHammerWarn(){
  const h=hammer;
  if(h.st!==1) return;
  const a=0.16+Math.abs(Math.sin(tAmb*10))*0.16;
  ctx.fillStyle='rgba(255,107,74,'+a+')';
  ctx.fillRect(0,h.y-20,VW,40);
  // arrows show which side it comes from
  ctx.strokeStyle='rgba(255,233,168,'+(a*3)+')'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
  for(let k=0;k<3;k++){
    const x=h.dir>0 ? 16+k*18 : VW-16-k*18;
    ctx.beginPath(); ctx.moveTo(x-h.dir*6,h.y-10); ctx.lineTo(x+h.dir*4,h.y); ctx.lineTo(x-h.dir*6,h.y+10); ctx.stroke();
  }
}

function drawHammer(){
  const h=hammer;
  if(h.st!==2) return;
  ctx.save(); ctx.translate(h.x,h.y); if(h.dir<0) ctx.scale(-1,1);
  ctx.fillStyle='rgba(0,0,0,.16)';
  ctx.beginPath(); ctx.ellipse(-4,8,40,12,0,0,6.283); ctx.fill();
  ctx.fillStyle='#55705F';
  ctx.beginPath();                                 // tail
  ctx.moveTo(-26,0); ctx.quadraticCurveTo(-40,-10,-52,-24); ctx.quadraticCurveTo(-44,-6,-42,0);
  ctx.quadraticCurveTo(-44,6,-47,14); ctx.quadraticCurveTo(-38,7,-26,3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4,-10); ctx.quadraticCurveTo(-2,-30,-14,-9); ctx.closePath(); ctx.fill();
  const g=ctx.createLinearGradient(0,-14,0,13);
  g.addColorStop(0,'#46604F'); g.addColorStop(0.55,'#7E9883'); g.addColorStop(1,'#E8EFE6');
  ctx.fillStyle=g;
  ctx.beginPath();                                 // body
  ctx.moveTo(32,-4); ctx.bezierCurveTo(20,-13,0,-14,-14,-11); ctx.bezierCurveTo(-22,-8,-26,-5,-28,-3);
  ctx.lineTo(-28,4); ctx.bezierCurveTo(-18,10,4,13,32,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4E6A57';                         // the hammer
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(28,-21,12,42,6) : ctx.rect(28,-21,12,42); ctx.fill();
  ctx.fillStyle='#0B1A22';
  ctx.beginPath(); ctx.arc(34,-18,2.6,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(34,18,2.6,0,6.283); ctx.fill();
  ctx.restore();
}

// lights out: a pool of light around the swimmer, darkness beyond
function drawDark(){
  const R=cur.dark;
  const g=ctx.createRadialGradient(player.x,player.y,R*0.45,player.x,player.y,R);
  g.addColorStop(0,'rgba(0,4,9,0)'); g.addColorStop(1,'rgba(0,4,9,.95)');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
}
// what still shows in the dark: shark eyes, and the coral glow of a lunge
function drawEyes(s){
  const sc=s.sc||1;
  const ex=s.x+(Math.cos(s.a)*30+Math.sin(s.a)*6)*sc, ey=s.y+(Math.sin(s.a)*30-Math.cos(s.a)*6)*sc;
  ctx.fillStyle='rgba(255,236,190,.9)';
  ctx.beginPath(); ctx.arc(ex,ey,2.4*Math.sqrt(sc),0,6.283); ctx.fill();
  ctx.fillStyle='rgba(255,236,190,.18)';
  ctx.beginPath(); ctx.arc(ex,ey,7*Math.sqrt(sc),0,6.283); ctx.fill();
  if(s.lungeState===1){
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.a); ctx.scale(sc,sc);
    ctx.globalAlpha=0.45+Math.sin(tAmb*22)*0.22;
    ctx.strokeStyle=CORAL; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(0,0,50,26,0,0,6.283); ctx.stroke();
    ctx.restore();
  }
}

function drawPearl(p){
  if(p.clam && clamOpen(p)<0.35) return;
  const bob=p.clam ? 0 : Math.sin(p.ph)*3;
  const glow=9+depth*10+Math.sin(p.ph*1.6)*2;
  ctx.save(); ctx.translate(p.x,p.y+bob);
  const g=ctx.createRadialGradient(0,0,1,0,0,glow+11);
  g.addColorStop(0,'rgba(255,233,168,.85)');
  g.addColorStop(1,'rgba(255,233,168,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,glow+11,0,6.283); ctx.fill();
  ctx.fillStyle=SUN; ctx.beginPath(); ctx.arc(0,0,7,0,6.283); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(-2.2,-2.2,2.3,0,6.283); ctx.fill();
  ctx.restore();
}

function drawSwimmer(){
  if(!player.alive) return;
  if(player.invuln>0){
    ctx.save(); ctx.translate(player.x,player.y);
    const pulse=1+Math.sin(tAmb*9)*0.06;
    const g=ctx.createRadialGradient(0,0,10,0,0,26*pulse);
    g.addColorStop(0,'rgba(180,240,255,0)');
    g.addColorStop(0.72,'rgba(180,240,255,.12)');
    g.addColorStop(1,'rgba(220,250,255,.46)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,26*pulse,0,6.283); ctx.fill();
    ctx.strokeStyle='rgba(235,252,255,.7)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(0,0,26*pulse,0,6.283); ctx.stroke();
    ctx.restore();
  }
  ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.facing);
  ctx.scale(1.16,1.16);
  ctx.shadowColor='rgba(3,24,38,.85)'; ctx.shadowBlur=3.5;   // rim: separates him from the water

  const SKIN='#FBD3A8', SKIN_D='#D79A6C', SUIT='#133F63', CAP=CORAL;
  const kick  =Math.sin(player.tail*1.7);      // flutter kick
  const stroke=Math.sin(player.tail*0.85);     // front-crawl arm

  ctx.lineCap='round'; ctx.lineJoin='round';

  // --- trailing leg (far side, drawn darker so the two read apart) ---
  ctx.strokeStyle=SKIN_D; ctx.lineWidth=4.6;
  ctx.beginPath(); ctx.moveTo(-3,1);
  ctx.quadraticCurveTo(-12,3-kick*5, -21,2-kick*9); ctx.stroke();

  // --- near leg ---
  ctx.strokeStyle=SKIN; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-3,-1);
  ctx.quadraticCurveTo(-12,-3+kick*5, -21,-2+kick*9); ctx.stroke();

  // --- recovering arm, sweeping over the head ---
  const ang=-1.15+stroke*1.15;
  ctx.strokeStyle=SKIN_D; ctx.lineWidth=4.2;
  ctx.beginPath(); ctx.moveTo(8,-2);
  ctx.quadraticCurveTo(10+Math.cos(ang)*8, -3+Math.sin(ang)*9,
                       10+Math.cos(ang)*15, -2+Math.sin(ang)*15);
  ctx.stroke();

  // --- torso: dark suit over the hips and back, bare shoulders ---
  ctx.fillStyle=SUIT;
  ctx.beginPath(); ctx.ellipse(-1.5,0,10,5.7,0,0,6.283); ctx.fill();
  ctx.fillStyle=SKIN;
  ctx.beginPath(); ctx.ellipse(8.6,-1.4,7.2,4.9,0,0,6.283); ctx.fill();

  // --- pulling arm, reaching forward ---
  ctx.strokeStyle=SKIN; ctx.lineWidth=4.4;
  ctx.beginPath(); ctx.moveTo(9,1);
  ctx.quadraticCurveTo(17,4+stroke*2, 24,1+stroke*3); ctx.stroke();

  // --- head, cap and goggles ---
  ctx.fillStyle=SKIN_D;                               // neck shadow separates head from torso
  ctx.beginPath(); ctx.ellipse(12.6,-2.4,1.9,3.2,0,0,6.283); ctx.fill();
  ctx.fillStyle=SKIN;
  ctx.beginPath(); ctx.arc(15.6,-3,5.6,0,6.283); ctx.fill();
  ctx.fillStyle=CAP;                                  // bright cap = easy to spot
  ctx.beginPath(); ctx.arc(15.6,-3,5.8,Math.PI*1.02,Math.PI*2.13); ctx.fill();
  ctx.fillStyle='#14303F';
  ctx.beginPath(); ctx.ellipse(18.6,-2.6,2.3,1.8,0,0,6.283); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.arc(19.3,-3.3,0.8,0,6.283); ctx.fill();

  ctx.restore();

  // stung: little purple sparks fizz around you while you're slowed
  if(player.sting>0){
    ctx.strokeStyle='rgba(236,170,255,'+(0.4+0.4*Math.abs(Math.sin(tAmb*14)))+')';
    ctx.lineWidth=1.8; ctx.lineCap='round';
    for(let k=0;k<4;k++){
      const a=tAmb*5+k*1.57, r=20;
      const x=player.x+Math.cos(a)*r, y=player.y+Math.sin(a)*r;
      ctx.beginPath(); ctx.moveTo(x-4,y-3); ctx.lineTo(x,y+1); ctx.lineTo(x-2,y+2); ctx.lineTo(x+3,y+5); ctx.stroke();
    }
  }
  // bubble shield
  if(player.shield){
    const r=24+Math.sin(tAmb*4)*1.5;
    ctx.strokeStyle='rgba(205,248,255,.8)'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.arc(player.x,player.y,r,0,6.283); ctx.stroke();
    ctx.fillStyle='rgba(205,248,255,.10)'; ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(player.x-r*0.45,player.y-r*0.5,2.6,0,6.283); ctx.fill();
  }
}

function drawShark(s){
  ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.a);
  if(s.sc && s.sc!==1) ctx.scale(s.sc,s.sc);
  const wag=Math.sin(s.wob)*(s.stun>0?0.25:1);

  // wind-up telegraph: a warm halo means a lunge is coming
  if(s.lungeState===1){
    ctx.save();
    ctx.globalAlpha=0.45+Math.sin(tAmb*22)*0.22;
    ctx.strokeStyle=CORAL; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(0,0,50,26,0,0,6.283); ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle='rgba(0,0,0,.16)';
  ctx.beginPath(); ctx.ellipse(-4,8,42,13,0,0,6.283); ctx.fill();

  ctx.fillStyle='#3A5870';
  // crescent tail: long upper lobe, short lower lobe
  ctx.beginPath();
  ctx.moveTo(-28,0);
  ctx.quadraticCurveTo(-42,-10, -56,-27+wag*9);
  ctx.quadraticCurveTo(-46,-8, -44,-1);
  ctx.quadraticCurveTo(-46,7, -50,17+wag*9);
  ctx.quadraticCurveTo(-40,8, -28,4);
  ctx.closePath(); ctx.fill();

  // dorsal fin: swept back, half the old size
  ctx.beginPath();
  ctx.moveTo(2,-12); ctx.quadraticCurveTo(-3,-30,-17,-11);
  ctx.closePath(); ctx.fill();
  // pectoral fin
  ctx.beginPath();
  ctx.moveTo(12,7); ctx.quadraticCurveTo(4,26,-8,10);
  ctx.closePath(); ctx.fill();

  // body: pointed snout, thick shoulders, narrow tailstock
  const g=ctx.createLinearGradient(0,-17,0,16);
  g.addColorStop(0,'#2E4D66'); g.addColorStop(0.5,'#5C7E94');
  g.addColorStop(0.74,'#DCE8EE'); g.addColorStop(1,'#FFFFFF');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(46,-1);
  ctx.bezierCurveTo(38,-13, 18,-17, -6,-14);
  ctx.bezierCurveTo(-20,-12, -26,-8, -30,-4);
  ctx.lineTo(-30,5);
  ctx.bezierCurveTo(-22,11, -6,16, 14,14);
  ctx.bezierCurveTo(30,12, 41,7, 46,-1);
  ctx.closePath(); ctx.fill();

  // jaw — opens on the wind-up
  const open=s.mouth*7;
  ctx.fillStyle='#2A1216';
  ctx.beginPath();
  ctx.moveTo(44,1); ctx.quadraticCurveTo(32,9+open, 15,8+open*0.6);
  ctx.quadraticCurveTo(29,5, 44,1); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFFFFF';
  for(let i=0;i<5;i++){
    const tx=38-i*5.5;
    ctx.beginPath(); ctx.moveTo(tx,2.6+open*0.5); ctx.lineTo(tx-2.4,6.2+open*0.72); ctx.lineTo(tx+1.5,6.2+open*0.72); ctx.closePath(); ctx.fill();
  }
  // gills
  ctx.strokeStyle='rgba(20,44,60,.5)'; ctx.lineWidth=1.4;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(14-i*5,-9); ctx.lineTo(12-i*5,-1); ctx.stroke(); }
  // the Megalodon: old battle scars
  if(s.mega){
    ctx.strokeStyle='rgba(225,236,240,.55)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(-2,-11); ctx.lineTo(8,-3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,-10); ctx.lineTo(2,-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(24,-11); ctx.lineTo(20,-5); ctx.stroke();
  }
  // eye
  ctx.fillStyle='#0B1A22'; ctx.beginPath(); ctx.arc(30,-6,3.1,0,6.283); ctx.fill();
  ctx.restore();
}

function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  if(shakeT>0 && !reduced){
    const m=shakeT/14;
    ctx.translate(rand(-7,7)*m, rand(-7,7)*m);
  }
  const dark=!!cur.dark && state!==S.TITLE && state!==S.SELECT;
  bg();
  if(bands.length) drawBands();
  if(whirl) drawWhirl();
  for(const k of kelps) drawKelp(k);
  for(const r of rocks) drawRock(r);
  for(const p of pearls) if(!p.got && p.clam) drawClam(p);
  if(!dark){
    for(const p of pearls) if(!p.got) drawPearl(p);
    for(const b of shields) drawShieldItem(b);
  }
  drawBubbles();
  for(const p of bits){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(!dark) for(const j of jellies) drawJelly(j);
  if(hammer) drawHammerWarn();
  for(const s of sharks) drawShark(s);
  if(hammer) drawHammer();
  drawSwimmer();

  // vignette deepens with the water
  const v=ctx.createRadialGradient(VW/2,VH/2,VH*0.3,VW/2,VH/2,VH*0.78);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(1,12,22,'+(0.30+depth*0.42)+')');
  ctx.fillStyle=v; ctx.fillRect(0,0,VW,VH);

  if(dark){
    drawDark();
    // pearls, jellyfish and bubbles glow on their own; sharks show only their eyes
    for(const p of pearls) if(!p.got) drawPearl(p);
    for(const b of shields) drawShieldItem(b);
    for(const j of jellies) drawJelly(j);
    for(const s of sharks) drawEyes(s);
  }

  if(flashT>0){ ctx.fillStyle='rgba(255,107,74,'+(flashT/18*0.4)+')'; ctx.fillRect(0,0,VW,VH); }
}

/* ---------- loop ---------- */
let last=performance.now(), acc=0;
function frame(now){
  requestAnimationFrame(frame);        // queue first: a thrown frame can't stop the game
  let dt=now-last; last=now;
  if(dt>90) dt=90;
  acc+=dt;
  try{
    while(acc>=16.6667){ update(); acc-=16.6667; }
    render();
  }catch(err){
    acc=0;
    if(!frame.warned){ frame.warned=1; try{console.error('frame error:',err);}catch(e){} }
  }
}

/* =========================================================================
   FLOW
   ========================================================================= */
const el=id=>document.getElementById(id);
const ovTitle=el('ovTitle'), ovLevel=el('ovLevel'), ovCaught=el('ovCaught'),
      ovOver=el('ovOver'), ovWin=el('ovWin'), ovSelect=el('ovSelect'), ovPause=el('ovPause'),
      hud=el('hud'), goFlash=el('goFlash'), starFlash=el('starFlash'), btnPause=el('btnPause');
function show(o){ o.classList.add('show'); }
function hide(o){ o.classList.remove('show'); }
function hideAll(){ [ovTitle,ovLevel,ovCaught,ovOver,ovWin,ovSelect,ovPause].forEach(hide); }
// every delayed step checks it still belongs to the current run of the current level
let runId=0, clearing=false;
const later=(fn,ms)=>{ const id=runId; setTimeout(()=>{ if(id===runId) fn(); },ms); };

const HEART='<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2C5.5 15.6 2.4 12 2.4 8.2A5 5 0 0 1 12 5.6a5 5 0 0 1 9.6 2.6c0 3.8-3.1 7.4-9.6 13z"/></svg>';
function updateHUD(){
  el('hudLevel').textContent='Level '+(levelIdx+1);
  el('hudPearls').textContent=pearls.filter(p=>p.got).length+'/'+pearls.length;
  let h='';
  for(let i=0;i<START_LIVES;i++) h+=HEART.replace('class="heart"', i<lives?'class="heart"':'class="heart spent"');
  el('hudLives').innerHTML=h;
}
const starHTML=(n,of)=>{ let s=''; for(let i=0;i<(of||3);i++) s+= i<n ? '<em>&#9733;</em>' : '&#9733;'; return s; };

/* ---------- level select ---------- */
function buildGrid(){
  let h='';
  for(let i=0;i<NL;i++){
    const open=isOpen(i), L=LEVELS[i];
    const cls='lvl'+(i>=12?' deep':'')+(i+1===save.unlocked && !save.stars[i]?' next':'');
    h+='<button class="'+cls+'" data-l="'+i+'"'+(open?'':' disabled')+' aria-label="Level '+(i+1)+(L.name?' '+L.name:'')+'">'
      +'<b>'+(open?(i+1):'&#128274;')+'</b>'
      +(L.icon && open ? '<i>'+L.icon+'</i>' : '')
      +'<span class="st">'+starHTML(save.stars[i]||0)+'</span></button>';
  }
  el('grid').innerHTML=h;
}
el('grid').addEventListener('click',e=>{
  const b=e.target && e.target.closest ? e.target.closest('[data-l]') : null;
  if(!b || b.disabled) return;
  audio(); armBackGuard(); playLevel(parseInt(b.getAttribute('data-l'),10));
});
function openSelect(){
  runId++;
  state=S.SELECT; hud.hidden=true; btnPause.hidden=true;
  attract();
  buildGrid(); hideAll(); show(ovSelect);
}

/* ---------- a level ---------- */
function playLevel(i){ lives=START_LIVES; startLevel(i); }   // fresh hearts
function startLevel(i){
  runId++; clearing=false;
  levelIdx=i;
  buildLevel(i);
  state=S.INTRO;
  hud.hidden=false; btnPause.hidden=false; updateHUD();
  hideAll();
  el('lvZone').textContent=zoneFor(i);
  el('lvTitle').textContent='Level '+(i+1);
  el('lvDepth').style.width=(4+ (i/(NL-1))*96)+'%';
  show(ovLevel);
  later(()=>{
    hide(ovLevel);
    state=S.PLAY;
    freeze=45;
    goFlash.classList.remove('fire'); void goFlash.offsetWidth; goFlash.classList.add('fire');
  }, 1500);
}

function levelClear(){
  state=S.INTRO; clearing=true;
  sfx.clear();
  burst(player.x,player.y,SUN,26,4.5);
  const stars=lives;                         // hearts left = stars
  save.stars[levelIdx]=Math.max(save.stars[levelIdx]||0,stars);
  if(levelIdx+2>save.unlocked) save.unlocked=Math.min(NL,levelIdx+2);
  persist();
  const flashStars=k=>{ let s=''; for(let i=0;i<3;i++) s+= i<k ? '&#9733;' : '<span class="off">&#9733;</span>'; starFlash.innerHTML=s; };
  flashStars(0);
  starFlash.classList.remove('fire'); void starFlash.offsetWidth; starFlash.classList.add('fire');
  for(let k=1;k<=stars;k++) later(()=>{ flashStars(k); sfx.star(k); }, 160*k);
  if(levelIdx+1>=NL){
    later(()=>{
      state=S.WIN; hud.hidden=true; btnPause.hidden=true; hideAll();
      el('winStars').innerHTML='&#9733; '+totalStars()+' / '+(NL*3);
      show(ovWin); sfx.win();
    }, 1300);
    return;
  }
  const next=levelIdx+1;
  later(()=>playLevel(next), 1300);
}

function caught(){
  player.alive=false;
  lives--;
  sfx.chomp();
  burst(player.x,player.y,CORAL,22,4.2);
  burst(player.x,player.y,'#DCF0F5',14,3.0);
  shakeT=14; flashT=18;
  state=S.CAUGHT;
  updateHUD();
  later(()=>{
    if(lives<=0){
      state=S.OVER; hideAll();
      el('overLine').textContent='Level '+(levelIdx+1);
      show(ovOver); sfx.over();
    } else {
      hideAll(); show(ovCaught);
    }
  }, 780);
}

function newGame(){ playLevel(0); }

/* ---------- pause ---------- */
function pause(){
  if((state!==S.PLAY && state!==S.INTRO) || clearing) return;
  runId++;                                  // a pending "Go!" must not unpause by itself
  state=S.PAUSE; ptr=null; target=null;
  hideAll(); show(ovPause);
}
function resume(){
  if(state!==S.PAUSE) return;
  hideAll(); state=S.PLAY; freeze=Math.max(freeze,30);
  goFlash.classList.remove('fire'); void goFlash.offsetWidth; goFlash.classList.add('fire');
}

/* ---------- the phone's back gesture ----------
   Swiping in from the left/right edge of an Android phone is "back", which
   closes a tab opened from a link. Keep one spare history entry so that swipe
   lands here and just pauses. It is re-armed on the next touch (browsers only
   honour entries added during a tap). Two quick backs still leave. */
let guarded=false;
function armBackGuard(){
  if(guarded) return;
  try{ history.pushState({egw:1},''); guarded=true; }catch(e){}
}
window.addEventListener('popstate',()=>{ guarded=false; pause(); });
try{ document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); }); }catch(e){}

/* ---------- input ---------- */
function toArena(e){
  const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH, touch:e.pointerType==='touch' };
}
function aimAt(q){
  let x=q.x, y=q.y;
  if(q.touch){
    // Lift the swimmer above the fingertip so a small thumb never covers it —
    // but ease that offset back to zero near the bottom edge, or the lowest
    // strip of the arena (and any pearl in it) becomes impossible to reach.
    y -= 62 * clamp((VH-q.y)/130, 0, 1);
    // Stretch sideways so the swimmer touches the wall before the finger
    // reaches the screen edge, where the phone's back-swipe lives.
    x = (q.x-EDGE)/(VW-2*EDGE)*VW;
  }
  return {x:clamp(x,0,VW), y:clamp(y,0,VH)};
}
function liftPointer(){ ptr=null; target=null; }
cv.addEventListener('pointerdown',e=>{ audio(); armBackGuard(); cv.setPointerCapture(e.pointerId); ptr=toArena(e); e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') ptr=toArena(e); });
cv.addEventListener('pointerup',liftPointer);
cv.addEventListener('pointercancel',liftPointer);

const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};
window.addEventListener('keydown',e=>{
  if(e.key==='Escape' || e.key==='p'){ state===S.PAUSE ? resume() : pause(); return; }
  const k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(k){ keys[k]=true; ptr=null; target=null; audio(); e.preventDefault(); }
});
window.addEventListener('keyup',e=>{
  const k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(k) keys[k]=false;
});

el('btnStart').addEventListener('click',()=>{ audio(); armBackGuard(); openSelect(); });
el('btnSelBack').addEventListener('click',()=>{ hideAll(); state=S.TITLE; attract(); refreshTitle(); show(ovTitle); });
el('btnRetry').addEventListener('click',()=>{ hideAll(); startLevel(levelIdx); });
el('btnRestart').addEventListener('click',()=>{ hideAll(); playLevel(levelIdx); });
el('btnPlayAgain').addEventListener('click',openSelect);
el('btnOverLevels').addEventListener('click',openSelect);
el('btnPauseLevels').addEventListener('click',openSelect);
el('btnResume').addEventListener('click',()=>{ armBackGuard(); resume(); });
btnPause.addEventListener('click',()=>{ armBackGuard(); pause(); });

const btnMute=el('btnMute');
btnMute.addEventListener('click',()=>{
  muted=!muted;
  btnMute.innerHTML = muted ? '&#128263;' : '&#9835;';
  btnMute.setAttribute('aria-label', muted?'Unmute sound':'Mute sound');
});

/* ---------- attract mode ---------- */
let cruising=false;
function attract(){
  depth=0.12; cur={};
  rocks=[]; kelps=[]; pearls=[]; bits=[];
  jellies=[]; bands=[]; whirl=null; hammer=null; shields=[];
  // no words explain the controls — the swimmer just follows your finger here,
  // with the shark cruising past harmlessly, before you ever press Play
  player.alive=true; player.invuln=0; player.sting=0; player.shield=false;
  player.x=VW*0.5; player.y=VH*0.84; player.vx=player.vy=0; player.facing=-Math.PI/2;
  sharks=[{x:118,y:VH*0.62,a:0,spd:1.5,sc:1,stun:0,lungeCd:9e9,lungeState:0,lungeT:0,mouth:0,wob:0}];
  bubbles=[];
  for(let n=0;n<26;n++) bubbles.push({x:rand(0,VW),y:rand(0,VH),r:rand(1.4,4.2),sp:rand(0.25,0.9),ph:rand(0,6.283)});
  if(cruising) return;
  cruising=true;
  (function cruise(){
    if(state!==S.TITLE && state!==S.SELECT){ cruising=false; return; }
    const s=sharks[0];
    if(s){
      s.x+=1.35*PACE; s.y=VH*0.62+Math.sin(s.x*0.012)*54;
      s.a=Math.sin(s.x*0.012+1.57)*0.30; s.wob+=0.09;
      if(s.x>VW+110){ s.x=-110; }
    }
    requestAnimationFrame(cruise);
  })();
}

function refreshTitle(){
  const t=totalStars();
  el('bestLine').textContent = t ? '★ '+t+' / '+(NL*3) : (save.unlocked>1 ? 'Best · Level '+save.unlocked : '');
}
refreshTitle();
resize();
attract();
requestAnimationFrame(frame);
})();
</script>
